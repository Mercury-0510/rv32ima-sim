name: Build and test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # 两个矩阵格跑在不同 runner 上，OFF 那一格不增加墙钟时间。ENABLE_TRACE=OFF
    # 的路径没有 CI 覆盖就会悄悄烂掉。fail-fast 关掉，让两格都出结果。
    strategy:
      fail-fast: false
      matrix:
        trace: ['ON', 'OFF']
    name: build-and-test (ENABLE_TRACE=${{ matrix.trace }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DENABLE_TRACE=${{ matrix.trace }}
          -DPython3_EXECUTABLE="$(command -v python)"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      # 逐字执行 README 里的示例命令，确保文档中的用法始终可用。
      # 也顺带检出 programs/diff_smoke.elf 是否与 diff_smoke.S 脱节。
      - name: Run the documented example
        run: |
          output=$(./build/sim programs/diff_smoke.elf --stop-pc test_done 2>&1)
          echo "$output"
          grep -q 'retired=33 status=complete' <<< "$output"
